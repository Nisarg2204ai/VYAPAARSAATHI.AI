services:
  - type: static
    name: vyapaarsaathi-ai-frontend
    buildCommand: npm install && npm run build --workspace=frontend
    staticPublishPath: frontend/out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600, s-maxage=86400
